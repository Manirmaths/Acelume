services:
  # FastAPI backend -> currently serves the API at api.naijaprep.com.ng.
  #
  # Rename history: Naija Prep -> Burina (abandoned) -> Acelume (current).
  # acelume.ng and acelume.com.ng were registered 2026-07-30; acelume.ng is
  # the chosen canonical domain. Migration is deliberately PHASED:
  #
  #   Step 1 (done): Render services renamed to acelume-*, acelume domains
  #                  appended to FRONTEND_ORIGINS. naijaprep.com.ng stays
  #                  primary -- nothing user-facing changes yet.
  #   Step 2 (todo, only after acelume.ng SSL is verified working): reorder
  #                  FRONTEND_ORIGINS to put acelume.ng first, switch
  #                  VITE_API_URL to api.acelume.ng, update canonical/OG
  #                  tags + sitemap.xml + robots.txt, verify acelume.ng in
  #                  Resend and move RESEND_FROM_EMAIL onto it.
  #
  # Service names below MUST match the real Render services (renamed to
  # acelume-api / acelume-web in the dashboard on 2026-07-30) -- if they
  # drift, a Blueprint sync creates duplicate services instead of updating
  # the existing ones.
  - type: web
    name: acelume-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        # ORDER IS LOAD-BEARING. PUBLIC_APP_URL defaults to
        # FRONTEND_ORIGINS[0] when unset, and that is what builds
        # password-reset links (auth.py) and the Paystack callback URL
        # (payments.py).
        #
        # Step 2 (2026-07-30): acelume.ng promoted to first position after
        # verifying https://acelume.ng serves with a valid cert and
        # https://api.acelume.ng/api/health returns ok. Password-reset links
        # and payment callbacks now land on acelume.ng.
        #
        # naijaprep.com.ng entries stay in the list -- they are NOT dead
        # weight. The Android app in Play Store closed testing still points
        # at that domain (capacitor.config.json -> server.url), and old
        # inbound links and search results still resolve there. Removing
        # them would break the shipped app for existing testers.
        value: https://acelume.ng,https://www.acelume.ng,https://acelume.com.ng,https://www.acelume.com.ng,https://naijaprep.com.ng,https://www.naijaprep.com.ng
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ENV
        value: production
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

  # React/Vite frontend. Canonical domain is acelume.ng as of Step 2
  # (2026-07-30); naijaprep.com.ng and acelume.com.ng remain live and serve
  # the same build, with <link rel="canonical"> in index.html pointing search
  # engines at acelume.ng.
  #
  # NOTE: Render static sites apply route rules to every attached domain, so
  # there is no per-host 301 here -- naijaprep.com.ng serves the site rather
  # than redirecting to acelume.ng. Consolidation therefore relies on the
  # canonical tag plus a Change of Address in Google Search Console. A true
  # host-based redirect would need a proxy or a DNS/CDN layer in front.
  #
  # VITE_API_URL is baked in at BUILD time, so this value only takes effect
  # on the next deploy.
  - type: web
    name: acelume-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.acelume.ng
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
