services:
  # FastAPI backend -> serves the API at api.naijaprep.com.ng.
  #
  # Rename history: Naija Prep -> Burina (abandoned) -> Acelume (current, and
  # the GitHub repo name). As of 2026-07-29 the rename is code/copy only --
  # no Acelume domain is registered yet, so every domain below is still
  # naijaprep.com.ng and that is deliberate, not an oversight. When an Acelume
  # domain is secured, add it as a custom domain in Render and append it to
  # FRONTEND_ORIGINS *after* the naijaprep entries (see note below).
  - type: web
    name: naijaprep-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        # Keep the live domain FIRST: PUBLIC_APP_URL defaults to
        # FRONTEND_ORIGINS[0] when unset, and that is what builds
        # password-reset links. Putting an unregistered domain first would
        # silently send users reset links to a domain that does not resolve.
        #
        # The burina.ng entries that used to sit here were removed on
        # 2026-07-29 -- that domain was never registered and the name was
        # dropped in favour of Acelume, so they were dead config.
        value: https://naijaprep.com.ng,https://www.naijaprep.com.ng
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ENV
        value: production
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

  # React/Vite frontend -> served at naijaprep.com.ng. Service names below
  # (naijaprep-api / naijaprep-web) are Render resource identifiers, not
  # branding -- renaming them would recreate the services and lose their
  # configured env vars and custom domains, so they stay as they are.
  - type: web
    name: naijaprep-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.naijaprep.com.ng
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
