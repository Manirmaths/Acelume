      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3b32c9"/>
    </linearGradient>
  </defs>
  <!-- Outer rounded square -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#acelume-bg)"/>
